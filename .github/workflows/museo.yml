name: Museo del Ciclismo (classements avant 2009)

# Collecte du Museo del Ciclismo (museociclismo.it ; accord obtenu par le propriétaire, 18/11/2026, crédit « Museo del Ciclismo ») :
# classements d'avant 2009 selon la sélection élargie (--selection, décision du propriétaire du 18/11/2026 : épreuves de notre index,
# championnats, courses du calendrier CQ Ranking 1999-2008 en France ou avec un Français dans le top 10 ; selection.json), puis listes
# « professionisti » (dates de naissance) au lieu des fiches coureurs. Écrit data/archives/sources/museo/ SEUL. Code : museo.py du dépôt
# Camelbaggy/courses-cyclistes (main). >= 3,2 s entre requêtes. Se relance tant que etat.json annonce du travail ET que le passage progresse.
on:
  schedule:
    - cron: '29 4 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget de temps du passage, en minutes"
        required: false
        default: "50"

permissions:
  contents: write
  actions: write   # relance du workflow (gh workflow run)

concurrency:
  group: museo-data
  cancel-in-progress: false

jobs:
  museo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout du dépôt d'archives (données)
        uses: actions/checkout@v4
        with:
          path: archives
          ref: ${{ github.ref_name }}
      - name: Checkout du dépôt principal (code)
        uses: actions/checkout@v4
        with:
          repository: Camelbaggy/courses-cyclistes
          ref: main
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collecte Museo del Ciclismo
        env:
          PYTHONUNBUFFERED: "1"
          BUDGET_ENTREE: ${{ inputs.budget }}
        run: |
          BUDGET="${BUDGET_ENTREE:-50}"
          echo "Budget : ${BUDGET} min"
          echo "BUDGET=$BUDGET" >> "$GITHUB_ENV"
          cd code
          timeout $((BUDGET + 10))m python museo.py --selection --archives "$GITHUB_WORKSPACE/archives/data/archives" --sortie "$GITHUB_WORKSPACE/archives/data/archives/sources/museo" --budget-min "$BUDGET" --sans-fiches --listes-coureurs professionisti
      - name: Commit des résultats
        # même si la collecte a échoué ou dépassé le délai : ce qui est écrit (fichiers écrits au fil de l'eau) est conservé
        if: ${{ !cancelled() }}
        working-directory: archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives/sources/museo/
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          echo "CHANGED=1" >> "$GITHUB_ENV"
          git commit -m "chore: résultats Museo del Ciclismo"
          # Poussée robuste : en cas de course (relance, passage concurrent d'un autre workflow), on rebase (nos fichiers
          # l'emportent) et on réessaie, 5 fois au plus.
          for ESSAI in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=1
              break
            fi
            echo "push refusé (essai ${ESSAI}/5)"
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 16))
          done
          if [ "${PUSH_OK:-0}" != "1" ]; then
            echo "::error::échec du push après 5 essais"
            exit 1
          fi
      - name: Relance s'il reste du travail
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_ENTREE: ${{ inputs.budget }}
        run: |
          ETAT="archives/data/archives/sources/museo/etat.json"
          RESTE=$(python -c "
          import json, sys
          try:
              with open(sys.argv[1], encoding='utf-8') as f:
                  e = json.load(f)
              print('non' if e.get('termine') else 'oui (%s)' % {k: v for k, v in e.items() if k != 'termine'})
          except (OSError, ValueError):
              print('inconnu')
          " "$ETAT")
          if [ "$RESTE" = "non" ]; then
            echo "pas de relance : collecte terminée (etat.json : termine)"
          elif [ "$RESTE" = "inconnu" ]; then
            echo "pas de relance : etat.json absent ou illisible"
          elif [ "$CHANGED" != "1" ]; then
            echo "pas de relance : reste du travail ($RESTE) mais ce passage n'a rien changé (pas de progrès)"
          else
            echo "relance : reste du travail $RESTE"
            if [ -n "$BUDGET_ENTREE" ]; then
              gh workflow run museo.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f budget="$BUDGET_ENTREE"
            else
              gh workflow run museo.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            fi
          fi
