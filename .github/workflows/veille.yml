name: Veille (relance des passages sautés)

# GitHub retarde ou abandonne souvent les déclenchements programmés (crons) de ce dépôt, surtout la nuit : archives.yml
# (6 crons nocturnes) peut ne jamais démarrer. Ce workflow, déclenché toutes les heures (24 chances par jour), relance :
#   - archives.yml si aucun passage n'a démarré depuis 20 h, et, pendant la saison des courses, seulement entre 23 h et 11 h UTC
#     (hors créneau d'update.yml, pour limiter la charge sur DataRide) ; en intersaison (collector.periode_de_courses faux :
#     aucune course en cours ou à 3 jours près), à toute heure, et dès 1 h sans passage s'il reste des saisons à collecter ;
#   - wikidata.yml si aucun passage n'a démarré depuis 8 jours (le cron du dimanche a été sauté).
# Rien n'est relancé si un passage du même workflow est en file ou en cours. Aucun accès aux données : lecture de la liste
# des exécutions et déclenchement seulement (jeton du dépôt).
# Les contrôles sont dans .github/scripts/veille.sh, partagé avec battement.yml (qui les exécute toutes les 10 min : ce cron
# n'est que le secours). En plus : relance battement.yml s'il n'est ni en file ni en cours.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: veille
  cancel-in-progress: true

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout des scripts (dépôt d'archives)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Checkout du dépôt principal (code et Calendrier)
        uses: actions/checkout@v4
        with:
          repository: Camelbaggy/courses-cyclistes
          ref: main
          path: code
      - name: Relance des passages sautés
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SAISONS: ${{ vars.ARCHIVES_SAISONS || '2009-2025' }}
          CODE_DIR: code
        run: bash .github/scripts/veille.sh
      - name: Relance du battement s'il ne tourne pas
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/relance_battement.sh
