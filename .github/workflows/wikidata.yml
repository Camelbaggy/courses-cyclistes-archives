name: Wikidata (enrichissement de l'encyclopédie)

# Remplit le cache data/archives/entites/wikidata/ (coureurs, images Commons, équipes, lignées) avec le code de
# Camelbaggy/courses-cyclistes (wikidata.py). N'écrit QUE ce cache : les fichiers entites/ sont reconstruits par le
# passage nocturne d'archives.yml, qui lit ce cache. Hôtes différents de DataRide : peut tourner en même temps
# qu'archives.yml (groupe de concurrence distinct, aucun chemin commun).
# Premier remplissage : lancement manuel (budget 300 min, ~13 500 requêtes à 1/s). Ensuite : chaque dimanche
# (nouveaux coureurs et équipes, re-vérifications), même budget (le passage s'arrête dès qu'il n'y a plus rien à faire).
on:
  schedule:
    - cron: '7 3 * * 0'
  workflow_dispatch:
    inputs:
      budget:
        description: "Budget Wikidata (coureurs, équipes) en minutes (défaut 300)"
        required: false
        default: "300"
      budget_historique:
        description: "Budget de l'historique des épreuves en minutes (défaut 30)"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: wikidata-data
  cancel-in-progress: false

jobs:
  wikidata:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout du dépôt d'archives (données)
        uses: actions/checkout@v4
        with:
          path: archives
          ref: ${{ github.ref_name }}
      - name: Checkout du dépôt principal (code)
        uses: actions/checkout@v4
        with:
          repository: Camelbaggy/courses-cyclistes
          ref: main
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Historique des épreuves (palmarès Wikidata)
        env:
          PYTHONUNBUFFERED: "1"
          BUDGET_ENTREE: ${{ inputs.budget_historique }}
        run: |
          BUDGET="${BUDGET_ENTREE:-30}"
          case "$BUDGET" in ''|*[!0-9]*) echo "budget invalide : $BUDGET"; exit 1;; esac
          [ "$BUDGET" = "0" ] && { echo "historique ignoré (budget 0)"; exit 0; }
          cd code
          ARCHIVES_DIR="$GITHUB_WORKSPACE/archives/data/archives" timeout $((BUDGET + 15))m \
            python run_pipeline.py --historique --budget-min "$BUDGET"
      - name: Enrichissement Wikidata
        if: ${{ !cancelled() }}
        env:
          PYTHONUNBUFFERED: "1"
          BUDGET_ENTREE: ${{ inputs.budget }}
        run: |
          BUDGET="${BUDGET_ENTREE:-300}"
          case "$BUDGET" in ''|*[!0-9]*) echo "budget invalide : $BUDGET"; exit 1;; esac
          echo "Budget : $BUDGET min"
          cd code
          ARCHIVES_DIR="$GITHUB_WORKSPACE/archives/data/archives" timeout $((BUDGET + 15))m \
            python run_pipeline.py --wikidata --budget-min "$BUDGET"
      - name: Commit du cache
        if: always()
        working-directory: archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives/entites/wikidata/ data/archives/entites/historique/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "chore: cache Wikidata et historique"
          for ESSAI in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=1
              break
            fi
            echo "push refusé (essai ${ESSAI}/5)"
            git rebase --abort 2>/dev/null || true
            sleep $((5 + RANDOM % 16))
          done
          if [ "${PUSH_OK:-0}" != "1" ]; then
            echo "::error::échec du push après 5 essais"
            exit 1
          fi
